name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Medir y comprobar cobertura
        shell: Rscript {0}
        run: |
          cobertura <- covr::package_coverage(
            type = "tests",
            quiet = FALSE
          )

          print(cobertura)

          porcentaje <- covr::percent_coverage(cobertura)

          resumen <- sprintf(
            "## Cobertura de tests\n\nResultado: **%.2f%%**.\n\nMinimo requerido: **75%%**.\n",
            porcentaje
          )

          cat(
            resumen,
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            append = TRUE
          )

          if (!is.finite(porcentaje) || porcentaje < 75) {
            stop("La cobertura debe alcanzar al menos el 75%.")
          }
